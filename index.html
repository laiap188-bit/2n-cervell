<!doctype html><html lang="ca"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#f7f5f1"><meta name="apple-mobile-web-app-capable" content="yes"><title>2n cervell</title><style>:root{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;color:#34352f;background:#f7f5f1}*{box-sizing:border-box}body{margin:0}main{max-width:650px;margin:auto;padding:26px 18px 90px}h1{font-size:36px;letter-spacing:-1.5px;margin:4px 0}h2{font-size:23px;margin:14px 0}p,small{color:#777970}header{display:flex;align-items:center;justify-content:space-between;margin-bottom:24px}.muted{color:#85877e;font-size:12px;letter-spacing:2px;text-transform:uppercase}.tiles{display:grid;grid-template-columns:1fr 1fr;gap:12px}.tile,.panel{background:#fff;border:1px solid #eeece6;border-radius:18px;padding:19px;box-shadow:0 3px 12px #29291c08}.tile{min-height:130px;text-align:left;font:inherit;cursor:pointer}.tile b{display:block;font-size:18px;margin:20px 0 5px}.tile span{font-size:12px;color:#777970}.back{border:0;background:none;color:#60675c;font-size:16px;padding:10px 0;cursor:pointer}input,select,textarea{font:inherit;padding:13px;border:1px solid #dddcd4;border-radius:12px;background:#fff;max-width:100%;width:100%;color:#34352f}label{font-size:13px;color:#60635c;display:block;margin:12px 0 6px}button.primary{background:#535f53;color:#fff;border:0;border-radius:12px;padding:13px 18px;font:inherit;cursor:pointer;margin-top:12px}button.secondary{background:#eeeee8;border:0;border-radius:10px;padding:8px 10px;color:#4e574d;cursor:pointer}.item{display:flex;gap:10px;align-items:center;padding:13px 0;border-bottom:1px solid #efeee9}.item:last-child{border-bottom:0}.item input[type=checkbox]{width:20px;height:20px;accent-color:#788d79;flex-shrink:0}.item .content{flex:1;min-width:0}.item .content b{display:block;overflow-wrap:anywhere}.item .content small{display:block;margin-top:3px}.actions{display:flex;gap:5px}.empty{padding:22px;text-align:center;color:#8a8b82}.row{display:flex;gap:10px}.row>*{flex:1;min-width:0}.days{display:grid;grid-template-columns:repeat(7,1fr);gap:5px}.day{border:0;border-radius:9px;padding:9px 0;background:#eeeee8;color:#42443f;cursor:pointer}.day.active{background:#788d79;color:white}.day.has{font-weight:bold;text-decoration:underline}.pill{background:#e8eee7;color:#4d6850;border-radius:20px;padding:5px 10px;font-size:12px}.note{font-size:12px;line-height:1.5}.hidden{display:none}nav{position:fixed;bottom:0;left:0;right:0;background:#fff;border-top:1px solid #e8e7e1;display:flex;justify-content:center;gap:5px;padding:10px 5px max(10px,env(safe-area-inset-bottom))}nav button{border:0;background:none;padding:10px 13px;border-radius:10px;color:#74766e;font-size:12px}nav button.active{background:#e9eee8;color:#445744}@media(min-width:650px){nav{position:static;border:0;background:transparent}} </style></head><body><main><header><div><div class="muted">El meu espai personal</div><h1>2n cervell.</h1><small>Tot al teu ritme.</small></div><div style="font-size:34px">◌</div></header><div id="app"></div></main><nav id="nav"></nav><script>
const KEY='2ncervell-v1';let data;try{data=JSON.parse(localStorage.getItem(KEY))||{tasks:[],habits:[],checks:{}}}catch{data={tasks:[],habits:[],checks:{}}}let page='inici',day=localDate();function localDate(d=new Date()){return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')}function save(){localStorage.setItem(KEY,JSON.stringify(data))}function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}function go(p){page=p;render()}function setDay(v){day=v;render()}function taskAdd(e){e.preventDefault();let f=e.target;data.tasks.push({id:Date.now()+Math.random(),title:f.title.value.trim(),date:f.date.value,time:f.time.value,done:false});save();render()}function habitAdd(e){e.preventDefault();let title=e.target.habit.value.trim();if(!title)return;data.habits.push({id:Date.now()+Math.random(),title});save();render()}function toggleTask(id){let t=data.tasks.find(t=>t.id===id);if(t)t.done=!t.done;save();render()}function toggleHabit(id){let k=day+'|'+id;data.checks[k]=!data.checks[k];save();render()}function delTask(id){if(confirm('Vols eliminar aquesta tasca?')){data.tasks=data.tasks.filter(t=>t.id!==id);save();render()}}function delHabit(id){if(confirm('Vols eliminar aquest hàbit?')){data.habits=data.habits.filter(t=>t.id!==id);save();render()}}function moveTask(id){let t=data.tasks.find(t=>t.id===id);let d=prompt('Nova data (AAAA-MM-DD):',t.date);if(d!==null&&/^\d{4}-\d{2}-\d{2}$/.test(d)&&!isNaN(new Date(d+'T12:00:00').getTime())){t.date=d;save();render()}}function editTask(id){let t=data.tasks.find(t=>t.id===id);let v=prompt('Nom de la tasca:',t.title);if(v!==null&&v.trim()){t.title=v.trim();save();render()}}function editHabit(id){let h=data.habits.find(h=>h.id===id);let v=prompt('Nom de l’hàbit:',h.title);if(v!==null&&v.trim()){h.title=v.trim();save();render()}}function itemTask(t){return `<div class="item"><input type="checkbox" aria-label="Completar tasca" ${t.done?'checked':''} onchange="toggleTask(${t.id})"><div class="content"><b style="${t.done?'text-decoration:line-through;color:#999':''}">${esc(t.title)}</b><small>${esc(t.date)} ${t.time?' · '+esc(t.time):''}</small></div><div class="actions"><button class="secondary" title="Editar" onclick="editTask(${t.id})">✎</button><button class="secondary" title="Canviar de dia" onclick="moveTask(${t.id})">↪</button><button class="secondary" title="Eliminar" onclick="delTask(${t.id})">×</button></div></div>`}function tasksFor(d){return data.tasks.filter(t=>t.date===d).sort((a,b)=>(a.time||'99:99').localeCompare(b.time||'99:99'))}function render(){let html='';if(page==='inici'){let pending=data.tasks.filter(t=>!t.done).length;html=`<h2>El teu espai</h2><div class="tiles"><button class="tile" onclick="go('agenda')">◷<b>Agenda</b><span>El planning d'avui</span></button><button class="tile" onclick="go('tasques')">☑<b>Tasques</b><span>${pending} pendents</span></button><button class="tile" onclick="go('habits')">◉<b>Hàbits</b><span>La teva constància</span></button><button class="tile" onclick="go('calendari')">▦<b>Calendari</b><span>Dies i setmanes</span></button></div><div class="panel" style="margin-top:16px"><b>Avui · ${esc(localDate())}</b><p>${tasksFor(localDate()).length} tasques programades</p><button class="secondary" onclick="go('agenda')">Veure el meu dia →</button></div>`}if(page==='agenda'||page==='tasques'){let list=page==='agenda'?tasksFor(day):data.tasks.filter(t=>!t.done).sort((a,b)=>a.date.localeCompare(b.date)||(a.time||'').localeCompare(b.time||''));html=`<button class="back" onclick="go('inici')">← Inici</button><h2>${page==='agenda'?'La meva agenda':'Tasques pendents'}</h2><div class="panel"><form onsubmit="taskAdd(event)"><label>Què vols fer?</label><input name="title" placeholder="Escriu una tasca..." required maxlength="150"><div class="row"><div><label>Dia</label><input name="date" type="date" value="${day}" required></div><div><label>Hora (opcional)</label><input name="time" type="time"></div></div><button class="primary">+ Afegir tasca</button></form></div>${page==='agenda'?`<label>Consulta un dia</label><input type="date" value="${day}" onchange="setDay(this.value)">`:''}<div class="panel" style="margin-top:15px"><b>${page==='agenda'?'Planning del dia':'Pendents'}</b>${list.length?list.map(itemTask).join(''):'<div class="empty">No hi ha tasques aquí ✨</div>'}</div>`}if(page==='habits'){let done=data.habits.filter(h=>data.checks[day+'|'+h.id]).length;html=`<button class="back" onclick="go('inici')">← Inici</button><h2>Els meus hàbits</h2><div class="panel"><form onsubmit="habitAdd(event)"><label>Nou hàbit</label><input name="habit" placeholder="Ex.: llegir, caminar, beure aigua..." required maxlength="100"><button class="primary">+ Afegir hàbit</button></form></div><label>Dia</label><input type="date" value="${day}" onchange="setDay(this.value)"><div class="panel" style="margin-top:15px"><span class="pill">${done} de ${data.habits.length} completats</span>${data.habits.length?data.habits.map(h=>`<div class="item"><input type="checkbox" ${data.checks[day+'|'+h.id]?'checked':''} onchange="toggleHabit(${h.id})"><div class="content"><b>${esc(h.title)}</b></div><button class="secondary" onclick="editHabit(${h.id})">✎</button><button class="secondary" onclick="delHabit(${h.id})">×</button></div>`).join(''):'<div class="empty">Afegeix el teu primer hàbit</div>'}</div><p class="note">Les marques es guarden per cada dia. Pots consultar dies anteriors canviant la data.</p>`}if(page==='calendari'){let d=new Date(day+'T12:00:00'),year=d.getFullYear(),month=d.getMonth(),first=(new Date(year,month,1).getDay()+6)%7,count=new Date(year,month+1,0).getDate();let cells=Array(first).fill('<span></span>');for(let i=1;i<=count;i++){let iso=localDate(new Date(year,month,i,12));cells.push(`<button class="day ${iso===day?'active':''} ${tasksFor(iso).length?'has':''}" onclick="setDay('${iso}')">${i}</button>`)}html=`<button class="back" onclick="go('inici')">← Inici</button><h2>Calendari</h2><label>Tria un mes o un dia</label><input type="date" value="${day}" onchange="setDay(this.value)"><div class="panel" style="margin-top:14px"><h3>${new Intl.DateTimeFormat('ca',{month:'long',year:'numeric'}).format(d)}</h3><div class="days">${['Dl','Dt','Dc','Dj','Dv','Ds','Dg'].map(x=>`<small style="text-align:center">${x}</small>`).join('')}${cells.join('')}</div></div><div class="panel" style="margin-top:14px"><b>${esc(day)}</b>${tasksFor(day).length?tasksFor(day).map(itemTask).join(''):'<div class="empty">Cap tasca programada</div>'}</div>`}document.getElementById('app').innerHTML=html;document.getElementById('nav').innerHTML=[['inici','Inici'],['agenda','Agenda'],['tasques','Tasques'],['habits','Hàbits'],['calendari','Calendari']].map(([id,n])=>`<button class="${page===id?'active':''}" onclick="go('${id}')">${n}</button>`).join('')}render();</script></body></html>
